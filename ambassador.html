<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preload" as="image" href="/logo.png"/>
<title>Area Ambassador — SHOCK Male Grooming</title>
<meta name="description" content="Area riservata Ambassador SHOCK Male Grooming: codice referral, listino riservato, cronologia ordini e riordini."/>
<link rel="icon" href="/favicon.ico?v=shock2" sizes="any" type="image/x-icon"/>
<link rel="icon" href="/favicon-32x32.png?v=shock2" sizes="32x32" type="image/png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=shock2"/>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0908;color:#f0ece5;font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:80px 24px 60px}
.logo{display:block;height:40px;width:auto;margin:0 auto 40px}
h1{font-size:1.6rem;font-weight:700;text-align:center;margin:0 0 8px}
.sub{color:rgba(240,236,229,.45);font-size:.9rem;text-align:center;margin:0 0 36px}
.card{background:#161412;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px}
label{display:block;font-size:.72rem;color:rgba(240,236,229,.5);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input{width:100%;padding:12px 14px;background:#0f0d0c;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font-size:.92rem;font-family:inherit;margin-bottom:16px}
button{width:100%;background:#c9a84c;color:#0a0908;border:none;border-radius:100px;padding:13px;font-weight:700;font-size:.85rem;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:#e0685e;font-size:.82rem;margin-bottom:14px}
.status{display:inline-block;font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px}
.status.active{background:rgba(76,175,80,.15);color:#4CAF50}
.status.suspended{background:rgba(224,104,94,.15);color:#e0685e}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.85rem}
.row span:first-child{color:rgba(240,236,229,.4)}
.coupon{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.82rem}
.coupon .c{font-family:monospace;color:#c9a84c;font-weight:700}
.empty{color:rgba(240,236,229,.3);font-size:.82rem;text-align:center;padding:16px 0}
.logout{display:block;text-align:center;margin-top:22px;font-size:.78rem;color:rgba(240,236,229,.4);text-decoration:underline;cursor:pointer;background:none;border:none}
.section{margin:28px 0 0}
.section h3{font-size:.7rem;color:rgba(240,236,229,.45);text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px}
.two-col{display:flex;gap:12px}
.two-col>div{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 10px;text-align:center}
.two-col .val{font-family:monospace;font-weight:700;color:#c9a84c;font-size:1.1rem;letter-spacing:.03em;word-break:break-all}
.two-col .val.green{color:#4CAF50}
.two-col .lbl{font-size:.66rem;color:rgba(240,236,229,.4);text-transform:uppercase;letter-spacing:.05em;margin-top:8px;line-height:1.4}
.btn-link{display:block;text-align:center;background:#c9a84c;color:#0a0908;border-radius:100px;padding:12px;font-weight:700;font-size:.85rem;text-decoration:none}
.btn-secondary{display:block;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#f0ece5;border-radius:100px;padding:11px;font-weight:700;font-size:.8rem;text-decoration:none;margin-top:10px}
.hint{font-size:.85rem;color:rgba(240,236,229,.65);line-height:1.6;margin:10px 0 14px}
.steps{list-style:none;margin:10px 0 16px;padding:0;counter-reset:step}
.steps li{position:relative;padding:0 0 0 30px;margin-bottom:10px;font-size:.85rem;color:rgba(240,236,229,.75);line-height:1.5}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:rgba(201,168,76,.18);color:#c9a84c;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.code-pill{display:inline-block;font-family:monospace;font-weight:700;background:rgba(201,168,76,.12);color:#c9a84c;padding:2px 8px;border-radius:6px;font-size:.88em}
.reorder-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.reorder-row .ri-img img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:#0f0d0c}
.reorder-row .ri-info{flex:1;min-width:0}
.reorder-row .ri-title{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reorder-row .ri-price{font-size:.78rem;color:rgba(240,236,229,.5)}
.reorder-row .ri-was{text-decoration:line-through;opacity:.5;margin-right:4px}
.reorder-row .ri-qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ri-btn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:#f0ece5;cursor:pointer;font-size:.9rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.ri-qty-val{min-width:16px;text-align:center;font-size:.85rem}
.kit-banner{background:linear-gradient(135deg,rgba(201,168,76,.14),rgba(201,168,76,.04));border:1px solid rgba(201,168,76,.4);border-radius:16px;padding:22px;margin-bottom:26px}
.kit-banner h2{margin:0 0 6px;font-size:1.05rem;color:#c9a84c}
.kit-banner p{margin:0 0 16px;font-size:.85rem;color:rgba(240,236,229,.65);line-height:1.5}
.kit-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.kit-row img{width:50px;height:50px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0f0d0c}
.kit-plus{color:rgba(240,236,229,.35);font-size:1rem;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <a href="/"><img class="logo" src="/logo.png" alt="Shock Male Grooming"></a>
  <h1>Area Ambassador</h1>
  <p class="sub">Codice referral, listino riservato e ordini</p>
  <div class="card" id="card">
    <p style="text-align:center;color:rgba(240,236,229,.4);font-size:.85rem">Caricamento...</p>
  </div>
</div>
<script>
(function(){
  var DOMAIN="shock-male-grooming.myshopify.com";
  var SF_TOKEN="0a215f25881fcbcbd0a0a7d8405b7ff6";
  var STORE_URL="https://shockmalegrooming.com";
  var KIT_PRODUCTS=["Curl Design","Beard Oil","Sea Salt Spray","Matt Paste","Shine Wax","Extra Matt"];
  var card=document.getElementById("card");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

  function sfetch(query,variables){
    return fetch("https://"+DOMAIN+"/api/2024-01/graphql.json",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Shopify-Storefront-Access-Token":SF_TOKEN},
      body:JSON.stringify({query:query,variables:variables||{}})
    }).then(function(r){return r.json();});
  }

  function renderLogin(errMsg){
    card.innerHTML=
      (errMsg?'<p class="err">'+esc(errMsg)+'</p>':'')+
      '<label>Email</label><input type="email" id="li-email">'+
      '<label>Password</label><input type="password" id="li-pass">'+
      '<button id="li-btn">Accedi</button>'+
      '<p style="text-align:center;font-size:.78rem;color:rgba(240,236,229,.4);margin-top:16px">Non hai ancora un account Ambassador? Contatta Shock per essere abilitato.</p>';
    document.getElementById("li-btn").addEventListener("click",function(){
      var email=document.getElementById("li-email").value.trim();
      var pass=document.getElementById("li-pass").value;
      if(!email||!pass){renderLogin("Inserisci email e password");return;}
      var btn=document.getElementById("li-btn");btn.disabled=true;btn.textContent="Accesso...";
      sfetch(
        'mutation login($email:String!,$password:String!){customerAccessTokenCreate(input:{email:$email,password:$password}){customerAccessToken{accessToken}customerUserErrors{message}}}',
        {email:email,password:pass}
      ).then(function(d){
        var res=d.data&&d.data.customerAccessTokenCreate;
        if(res&&res.customerUserErrors&&res.customerUserErrors.length){renderLogin(res.customerUserErrors[0].message);return;}
        var token=res&&res.customerAccessToken&&res.customerAccessToken.accessToken;
        if(!token){renderLogin("Credenziali non valide");return;}
        try{localStorage.setItem("shopify_token",token);}catch(e){}
        loadProfile(token);
      }).catch(function(){renderLogin("Errore di connessione, riprova")});
    });
  }

  function shopUrl(){
    return STORE_URL+"/prodotti";
  }

  function fetchCatalog(){
    return sfetch('{products(first:50){edges{node{title featuredImage{url} variants(first:1){edges{node{id price{amount}}}}}}}}').then(function(d){
      var edges=(d.data&&d.data.products&&d.data.products.edges)||[];
      return edges.map(function(e){
        var v=e.node.variants&&e.node.variants.edges[0]&&e.node.variants.edges[0].node;
        return {
          title:e.node.title,
          image:e.node.featuredImage&&e.node.featuredImage.url,
          variantId:v&&v.id,
          price:v&&v.price?parseFloat(v.price.amount):0
        };
      }).filter(function(p){return p.variantId&&p.price>0;});
    }).catch(function(){return [];});
  }

  function fetchKitVariantIds(){
    return sfetch('{products(first:50){edges{node{title variants(first:1){edges{node{id}}}}}}}').then(function(d){
      var edges=(d.data&&d.data.products&&d.data.products.edges)||[];
      var byTitle={};
      edges.forEach(function(e){
        var vid=e.node.variants&&e.node.variants.edges[0]&&e.node.variants.edges[0].node.id;
        if(vid)byTitle[e.node.title.trim().toLowerCase()]=vid;
      });
      return KIT_PRODUCTS.map(function(name){return byTitle[name.toLowerCase()];}).filter(Boolean);
    });
  }

  function createCart(lines,code,token){
    var input={lines:lines,discountCodes:[code]};
    if(token)input.buyerIdentity={customerAccessToken:token};
    return sfetch('mutation($input:CartInput!){cartCreate(input:$input){cart{checkoutUrl}userErrors{message field}}}',{input:input}).then(function(d){
      var res=d&&d.data&&d.data.cartCreate;
      var url=res&&res.cart&&res.cart.checkoutUrl;
      if(url)return url;
      var err=res&&res.userErrors&&res.userErrors[0];
      var isTokenIssue=err&&err.field&&err.field.indexOf("buyerIdentity")!==-1;
      if(token&&isTokenIssue)return createCart(lines,code,null);
      throw new Error((err&&err.message)||"errore checkout");
    });
  }

  function goToKitCheckout(code,btn){
    var token=null; try{token=localStorage.getItem("shopify_token");}catch(e){}
    var orig=btn.textContent; btn.disabled=true; btn.textContent="Preparo il checkout...";
    fetchKitVariantIds().then(function(variantIds){
      if(variantIds.length<KIT_PRODUCTS.length){throw new Error("prodotti del kit non trovati");}
      var lines=variantIds.map(function(id){return {merchandiseId:id,quantity:1};});
      return createCart(lines,code,token);
    }).then(function(url){
      window.location.href=url;
    }).catch(function(){
      btn.disabled=false; btn.textContent=orig;
      alert("Non sono riuscito a preparare il checkout automatico. Vai al negozio e inserisci il codice "+code+" manualmente.");
    });
  }

  function kitRowHtml(products){
    var byTitle={};
    (products||[]).forEach(function(p){byTitle[(p.title||"").trim().toLowerCase()]=p;});
    return KIT_PRODUCTS.map(function(name,i){
      var p=byTitle[name.toLowerCase()];
      var img=p&&p.image?'<img src="'+esc(p.image)+'" alt="'+esc(name)+'">':'<img src="/logo.png" alt="'+esc(name)+'" style="opacity:.3">';
      return (i>0?'<span class="kit-plus">+</span>':'')+img;
    }).join("");
  }

  function reorderSectionHtml(p,catalog){
    if(!p.supply_code)return "";
    var pct=p.supply_discount_pct||0;
    var rows=(catalog||[]).map(function(item){
      var fPrice=item.price*(1-pct/100);
      var img=item.image?'<img src="'+esc(item.image)+'" alt="">':'';
      return '<div class="reorder-row" data-vid="'+esc(item.variantId)+'">'+
        '<div class="ri-img">'+img+'</div>'+
        '<div class="ri-info"><div class="ri-title">'+esc(item.title)+'</div>'+
          '<div class="ri-price"><span class="ri-was">€'+item.price.toFixed(2)+'</span>€'+fPrice.toFixed(2)+'</div></div>'+
        '<div class="ri-qty">'+
          '<button type="button" class="ri-btn" data-qty-dec aria-label="Diminuisci">−</button>'+
          '<span class="ri-qty-val">0</span>'+
          '<button type="button" class="ri-btn" data-qty-inc aria-label="Aumenta">+</button>'+
        '</div>'+
      '</div>';
    }).join("");
    return '<div class="section"><h3>Ordina / Riordina</h3>'+
      '<p class="hint">Prezzi già scontati del tuo listino fornitura (-'+esc(pct)+'%). Scegli le quantità: ti portiamo dritto al checkout con lo sconto già applicato'+(p.wallet_code?', poi inserisci lì anche il codice del portafoglio qui sopra per scalare il saldo':'')+'.</p>'+
      '<div id="reorder-list">'+rows+'</div>'+
      '<button type="button" class="btn-link" id="reorder-checkout-btn" style="border:none;cursor:pointer;margin-top:14px;opacity:.5" disabled>Aggiungi almeno un prodotto</button>'+
    '</div>';
  }

  function renderProfile(p,products,catalog){
    var statusClass=p.status==="active"?"active":"suspended";
    var statusLabel=p.status==="active"?"Attivo":"Sospeso";
    var ledger=(p.ledger||[]).slice().reverse();
    var ledgerHtml=ledger.length
      ? ledger.slice(0,15).map(function(l){
          return '<div class="coupon"><span>'+esc(l.order_name||"Ordine")+'</span><span class="c">+€'+Number(l.margin||0).toFixed(2)+'</span></div>';
        }).join("")
      : '<div class="empty">Nessun ordine ancora — appena un cliente ordina col tuo codice, qui vedi quanto hai maturato.</div>';

    var showKitBanner=!!(p.first_order_code&&!p.first_order_used&&p.status==="active");
    var kitBannerHtml=showKitBanner
      ? '<div class="kit-banner">'+
          '<h2>🎉 Il tuo pacchetto di benvenuto</h2>'+
          '<p>Sul tuo primo ordine hai diritto a <b>-60%</b> sul pacchetto Ambassador: Curl Design, Beard Oil, Sea Salt Spray, Matt Paste, Shine Wax ed Extra Matt. Clicca qui sotto: ti portiamo dritto al checkout con questi prodotti nel carrello e lo sconto già inserito.</p>'+
          '<div class="kit-row">'+kitRowHtml(products)+'</div>'+
          '<button type="button" class="btn-link" id="kit-checkout-btn" style="border:none;cursor:pointer">Vai al checkout con lo sconto già applicato</button>'+
        '</div>'
      : '';

    card.innerHTML=
      '<span class="status '+statusClass+'">'+statusLabel+'</span>'+
      (p.status!=="active"?'<p class="err">Il tuo profilo è sospeso: codici e listino riservato non sono al momento utilizzabili. Contatta Shock.</p>':'')+
      '<div class="row"><span>Negozio</span><span>'+esc(p.nome_negozio)+'</span></div>'+
      '<div class="row"><span>Regione</span><span>'+esc(p.region)+'</span></div>'+

      kitBannerHtml+

      '<div class="section"><h3>Codice Referral</h3>'+
      '<div class="two-col">'+
        '<div><div class="val">'+esc(p.code||"—")+'</div><div class="lbl">Codice sconto clienti'+(p.store_discount_pct?" · -"+esc(p.store_discount_pct)+"%":"")+'</div></div>'+
        '<div><div class="val green">€'+Number(p.wallet_balance||0).toFixed(2)+'</div><div class="lbl">Saldo portafoglio</div></div>'+
      '</div>'+
      (p.wallet_code?'<div class="two-col" style="margin-top:10px"><div style="flex:1"><div class="val" style="color:#4CAF50">'+esc(p.wallet_code)+'</div><div class="lbl">Codice del tuo portafoglio</div></div></div>':'')+
      '<p style="margin:18px 0 8px;font-size:.78rem;color:rgba(240,236,229,.5);font-weight:700;text-transform:uppercase;letter-spacing:.05em">Come funziona</p>'+
      '<ol class="steps">'+
        '<li>Dai il codice <span class="code-pill">'+esc(p.code||"")+'</span> ai tuoi clienti: lo usano al checkout e pagano il prezzo negozio.</li>'+
        '<li>La differenza tra prezzo online e prezzo fornitura si accumula da sola nel tuo portafoglio, qui sopra.</li>'+
        '<li>Quando fai un riordino, usa il codice <span class="code-pill">'+esc(p.wallet_code||"")+'</span> al checkout: Shopify scala quell’importo dal totale da pagare.</li>'+
      '</ol>'+
      '</div>'+

      '<div class="section"><h3>Listino riservato</h3>'+
      '<a class="btn-secondary" href="/listino-fornitura-ambassador.pdf" target="_blank" rel="noopener">Scarica il listino fornitura (PDF)</a>'+
      '</div>'+

      (p.supply_code?(
      '<div class="section"><h3>Il tuo codice riordini</h3>'+
      '<div class="two-col" style="margin-bottom:4px">'+
        '<div><div class="val">'+esc(p.supply_code)+'</div><div class="lbl">Codice riordini · -'+esc(p.supply_discount_pct)+'%</div></div>'+
      '</div>'+
      '</div>'
      ):'')+

      reorderSectionHtml(p,catalog)+

      '<div class="section"><h3>Cronologia ordini</h3>'+
      ledgerHtml+
      '</div>'+

      '<button class="logout" id="lo-btn">Esci</button>';
    document.getElementById("lo-btn").addEventListener("click",function(){
      try{localStorage.removeItem("shopify_token");}catch(e){}
      renderLogin();
    });
    var kcb=document.getElementById("kit-checkout-btn");
    if(kcb)kcb.addEventListener("click",function(){goToKitCheckout(p.first_order_code,kcb);});

    var reorderQty={};
    var reorderList=document.getElementById("reorder-list");
    var reorderBtn=document.getElementById("reorder-checkout-btn");
    function updateReorderBtn(){
      if(!reorderBtn)return;
      var n=0;
      Object.keys(reorderQty).forEach(function(vid){n+=reorderQty[vid]||0;});
      if(n>0){
        reorderBtn.disabled=false;reorderBtn.style.opacity="1";
        reorderBtn.textContent="Vai al checkout ("+n+(n===1?" articolo":" articoli")+")";
      }else{
        reorderBtn.disabled=true;reorderBtn.style.opacity=".5";
        reorderBtn.textContent="Aggiungi almeno un prodotto";
      }
    }
    if(reorderList){
      reorderList.addEventListener("click",function(e){
        var row=e.target.closest(".reorder-row");
        if(!row)return;
        var vid=row.getAttribute("data-vid");
        if(e.target.closest("[data-qty-inc]")){
          reorderQty[vid]=(reorderQty[vid]||0)+1;
        }else if(e.target.closest("[data-qty-dec]")){
          reorderQty[vid]=Math.max(0,(reorderQty[vid]||0)-1);
        }else return;
        var span=row.querySelector(".ri-qty-val");
        if(span)span.textContent=reorderQty[vid];
        updateReorderBtn();
      });
    }
    if(reorderBtn){
      reorderBtn.addEventListener("click",function(){
        var lines=Object.keys(reorderQty).filter(function(vid){return reorderQty[vid]>0;}).map(function(vid){return {merchandiseId:vid,quantity:reorderQty[vid]};});
        if(!lines.length)return;
        var token=null; try{token=localStorage.getItem("shopify_token");}catch(e){}
        var orig=reorderBtn.textContent;
        reorderBtn.disabled=true; reorderBtn.textContent="Preparo il checkout...";
        createCart(lines,p.supply_code,token).then(function(url){
          window.location.href=url;
        }).catch(function(){
          reorderBtn.disabled=false; reorderBtn.textContent=orig;
          alert("Non sono riuscito a preparare il checkout automatico. Vai al negozio e inserisci il codice "+p.supply_code+" manualmente.");
        });
      });
    }
  }

  function fetchKitProducts(){
    return fetch("/api/products").then(function(r){return r.json();}).then(function(d){return d.products||[];}).catch(function(){return [];});
  }

  function loadProfile(token){
    Promise.all([
      fetch("/api/ambassador/me?token="+encodeURIComponent(token)).then(function(r){return r.json().then(function(d){return {ok:r.ok,body:d};});}),
      fetchKitProducts(),
      fetchCatalog()
    ]).then(function(results){
      var res=results[0], products=results[1], catalog=results[2];
      if(!res.ok){
        if(res.body&&res.body.error==="Token non valido"){
          try{localStorage.removeItem("shopify_token");}catch(e){}
          renderLogin();
        }else{
          card.innerHTML='<p class="err">'+esc((res.body&&res.body.error)||"Accesso non consentito")+'</p><button class="logout" id="lo-btn2">Esci</button>';
          var b=document.getElementById("lo-btn2");
          if(b)b.addEventListener("click",function(){try{localStorage.removeItem("shopify_token");}catch(e){}renderLogin();});
        }
        return;
      }
      renderProfile(res.body.profile,products,catalog);
    }).catch(function(){
      card.innerHTML='<p class="err">Errore di connessione, riprova più tardi.</p>';
    });
  }

  var existingToken=null;
  try{existingToken=localStorage.getItem("shopify_token");}catch(e){}
  if(existingToken){loadProfile(existingToken);}else{renderLogin();}
})();
</script>
</body>
</html>
