<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preload" as="image" href="/logo.png"/>
<title>Area Ambassador — SHOCK Male Grooming</title>
<meta name="description" content="Area riservata Ambassador SHOCK Male Grooming: codice personale, listino riservato e coupon fornitura successiva."/>
<link rel="icon" href="/favicon.ico?v=shock2" sizes="any" type="image/x-icon"/>
<link rel="icon" href="/favicon-32x32.png?v=shock2" sizes="32x32" type="image/png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=shock2"/>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0908;color:#f0ece5;font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:80px 24px 60px}
.logo{display:block;height:40px;width:auto;margin:0 auto 40px}
h1{font-size:1.6rem;font-weight:700;text-align:center;margin:0 0 8px}
.sub{color:rgba(240,236,229,.45);font-size:.9rem;text-align:center;margin:0 0 36px}
.card{background:#161412;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px}
label{display:block;font-size:.72rem;color:rgba(240,236,229,.5);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input{width:100%;padding:12px 14px;background:#0f0d0c;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font-size:.92rem;font-family:inherit;margin-bottom:16px}
button{width:100%;background:#c9a84c;color:#0a0908;border:none;border-radius:100px;padding:13px;font-weight:700;font-size:.85rem;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:#e0685e;font-size:.82rem;margin-bottom:14px}
.code-box{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.35);border-radius:12px;padding:18px;text-align:center;margin-bottom:20px}
.code-box .code{font-family:monospace;font-size:1.4rem;font-weight:700;color:#c9a84c;letter-spacing:.05em}
.code-box p{margin:6px 0 0;font-size:.75rem;color:rgba(240,236,229,.5)}
.status{display:inline-block;font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px}
.status.active{background:rgba(76,175,80,.15);color:#4CAF50}
.status.suspended{background:rgba(224,104,94,.15);color:#e0685e}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.85rem}
.row span:first-child{color:rgba(240,236,229,.4)}
.coupon{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.82rem}
.coupon .c{font-family:monospace;color:#c9a84c;font-weight:700}
.empty{color:rgba(240,236,229,.3);font-size:.82rem;text-align:center;padding:16px 0}
.logout{display:block;text-align:center;margin-top:20px;font-size:.78rem;color:rgba(240,236,229,.4);text-decoration:underline;cursor:pointer;background:none;border:none}
</style>
</head>
<body>
<div class="wrap">
  <a href="/"><img class="logo" src="/logo.png" alt="Shock Male Grooming"></a>
  <h1>Area Ambassador</h1>
  <p class="sub">Codice personale, listino riservato e coupon fornitura successiva</p>
  <div class="card" id="card">
    <p style="text-align:center;color:rgba(240,236,229,.4);font-size:.85rem">Caricamento...</p>
  </div>
</div>
<script>
(function(){
  var DOMAIN="shock-male-grooming.myshopify.com";
  var SF_TOKEN="0a215f25881fcbcbd0a0a7d8405b7ff6";
  var card=document.getElementById("card");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

  function sfetch(query,variables){
    return fetch("https://"+DOMAIN+"/api/2024-01/graphql.json",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Shopify-Storefront-Access-Token":SF_TOKEN},
      body:JSON.stringify({query:query,variables:variables||{}})
    }).then(function(r){return r.json();});
  }

  function renderLogin(errMsg){
    card.innerHTML=
      (errMsg?'<p class="err">'+esc(errMsg)+'</p>':'')+
      '<label>Email</label><input type="email" id="li-email">'+
      '<label>Password</label><input type="password" id="li-pass">'+
      '<button id="li-btn">Accedi</button>'+
      '<p style="text-align:center;font-size:.78rem;color:rgba(240,236,229,.4);margin-top:16px">Non hai ancora un account Ambassador? Contatta Shock per essere abilitato.</p>';
    document.getElementById("li-btn").addEventListener("click",function(){
      var email=document.getElementById("li-email").value.trim();
      var pass=document.getElementById("li-pass").value;
      if(!email||!pass){renderLogin("Inserisci email e password");return;}
      var btn=document.getElementById("li-btn");btn.disabled=true;btn.textContent="Accesso...";
      sfetch(
        'mutation login($email:String!,$password:String!){customerAccessTokenCreate(input:{email:$email,password:$password}){customerAccessToken{accessToken}customerUserErrors{message}}}',
        {email:email,password:pass}
      ).then(function(d){
        var res=d.data&&d.data.customerAccessTokenCreate;
        if(res&&res.customerUserErrors&&res.customerUserErrors.length){renderLogin(res.customerUserErrors[0].message);return;}
        var token=res&&res.customerAccessToken&&res.customerAccessToken.accessToken;
        if(!token){renderLogin("Credenziali non valide");return;}
        try{localStorage.setItem("shopify_token",token);}catch(e){}
        loadProfile(token);
      }).catch(function(){renderLogin("Errore di connessione, riprova")});
    });
  }

  function renderProfile(p){
    var statusClass=p.status==="active"?"active":"suspended";
    var statusLabel=p.status==="active"?"Attivo":"Sospeso";
    var ledger=(p.ledger||[]).slice().reverse();
    var ledgerHtml=ledger.length
      ? ledger.slice(0,15).map(function(l){
          return '<div class="coupon"><span>'+esc(l.order_name||"Ordine")+'</span><span class="c">+€'+Number(l.margin||0).toFixed(2)+'</span></div>';
        }).join("")
      : '<div class="empty">Nessuna vendita cliente ancora — appena un cliente ordina col tuo codice, qui vedi quanto hai maturato.</div>';
    card.innerHTML=
      '<span class="status '+statusClass+'">'+statusLabel+'</span>'+
      (p.status!=="active"?'<p class="err">Il tuo profilo è sospeso: il codice e il listino riservato non sono al momento utilizzabili. Contatta Shock.</p>':'')+
      '<div class="code-box"><div class="code">'+esc(p.code||"—")+'</div><p>Codice per i tuoi clienti'+(p.store_discount_pct?' — prezzo da negozio, -'+esc(p.store_discount_pct)+'%':'')+'</p></div>'+
      (p.supply_code?'<div class="code-box"><div class="code">'+esc(p.supply_code)+'</div><p>Codice per i tuoi riordini (listino fornitura, -'+esc(p.supply_discount_pct)+'%) — uso personale, non condividerlo</p></div>':'')+
      (p.wallet_code?'<div class="code-box" style="border-color:rgba(76,175,80,.4);background:rgba(76,175,80,.08)"><div class="code" style="color:#4CAF50">€'+Number(p.wallet_balance||0).toFixed(2)+'</div><p>Il tuo portafoglio — inseriscilo insieme al codice riordini al checkout per scalare il saldo dal totale. Codice: <b style="font-family:monospace">'+esc(p.wallet_code)+'</b></p></div>':'')+
      '<div class="row"><span>Negozio</span><span>'+esc(p.nome_negozio)+'</span></div>'+
      '<div class="row"><span>Regione</span><span>'+esc(p.region)+'</span></div>'+
      (p.first_order_code?'<div class="row"><span>Codice primo ordine (una tantum'+(p.first_order_total_pct?", -"+esc(p.first_order_total_pct)+"%":"")+')</span><span style="font-family:monospace">'+esc(p.first_order_code)+'</span></div>':'')+
      '<p style="margin:20px 0 8px;font-size:.72rem;color:rgba(240,236,229,.45);text-transform:uppercase;letter-spacing:.06em">Vendite dei tuoi clienti</p>'+
      ledgerHtml+
      '<button class="logout" id="lo-btn" style="margin-top:22px">Esci</button>';
    document.getElementById("lo-btn").addEventListener("click",function(){
      try{localStorage.removeItem("shopify_token");}catch(e){}
      renderLogin();
    });
  }

  function loadProfile(token){
    fetch("/api/ambassador/me?token="+encodeURIComponent(token))
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,body:d};});})
      .then(function(res){
        if(!res.ok){
          if(res.body&&res.body.error==="Token non valido"){
            try{localStorage.removeItem("shopify_token");}catch(e){}
            renderLogin();
          }else{
            card.innerHTML='<p class="err">'+esc((res.body&&res.body.error)||"Accesso non consentito")+'</p><button class="logout" id="lo-btn2">Esci</button>';
            var b=document.getElementById("lo-btn2");
            if(b)b.addEventListener("click",function(){try{localStorage.removeItem("shopify_token");}catch(e){}renderLogin();});
          }
          return;
        }
        renderProfile(res.body.profile);
      }).catch(function(){
        card.innerHTML='<p class="err">Errore di connessione, riprova più tardi.</p>';
      });
  }

  var existingToken=null;
  try{existingToken=localStorage.getItem("shopify_token");}catch(e){}
  if(existingToken){loadProfile(existingToken);}else{renderLogin();}
})();
</script>
</body>
</html>
